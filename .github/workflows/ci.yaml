name: CI

on:
  push:

env:
  CI: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Show prepared workspace
        run: |
          echo "Prepare job runner: ${{ runner.name }}"
          echo "Workspace:"
          pwd
          echo
          echo "Files:"
          ls -la

  test:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Inspect test workspace
        run: |
          echo "Test job runner: ${{ runner.name }}"
          echo "Workspace:"
          pwd
          echo
          echo "Files:"
          ls -la

      - name: Run tests
        run: npm test
